<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T2 by CReticulata</title>
    <link rel="icon" href="./img/bag.png" type="image/png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Raleway"
    />
    <link rel="stylesheet" href="./stylesheet.css" type="text/css" />
    <script
      src="https://kit.fontawesome.com/159e7d696f.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <div class="container">
        <h1 class="logo">
          <a href="##">PRETTY GAL</a>
        </h1>
        <nav>
          <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#shop">Shop</a></li>
            <li><a href="#sale">Sale</a></li>
            <li><a href="#customer-care">Customer Care</a></li>
            <li><a href="#stockists">Stockists</a></li>
          </ul>
        </nav>

        <div class="shopping-cart">
          <a href="##">
            <img src="./img/bag.png" alt="shopping-cart" />
          </a>
        </div>
      </div>
    </header>
    <main>
      <section class="banner">
        <div class="cover">
          <div class="title">
            <h1 class="brand-name">FALL & WINTER</h1>
            <a href="#shop-now">Shop Now</a>
          </div>
        </div>
        <div class="sub-title">FREE SHIPPING WORLDWIDE</div>
      </section>
      <section class="products">
        <div class="container">
          <h1>YEAR ROUND</h1>
          <div class="separating-line"></div>
          <h2>Must Have Items</h2>
          <ul class="items">
            <li class="item">
              <a href="#item-1"><img src="./img/left.png" alt="item-1" /></a>
            </li>
            <li class="item">
              <a href="#item-2"><img src="./img/middle.png" alt="item-2" /></a>
            </li>
            <li class="item">
              <a href="#item-3"><img src="./img/right.png" alt="item-3" /></a>
            </li>
          </ul>
        </div>
      </section>
    </main>
    <footer>
      <div class="container">
        <div class="information">
          <div class="sub-container">
            <div class="sns">
              <p class="description">STAY CONNECTED</p>
              <ul>
                <li>
                  <a href="https://www.facebook.com/"
                    ><i class="fa-brands fa-facebook-f"></i
                  ></a>
                </li>
                <li>
                  <a href="https://www.twitter.com/"
                    ><i class="fa-brands fa-twitter"></i
                  ></a>
                </li>
                <li>
                  <a href="https://www.pinterest.com/"
                    ><i class="fa-brands fa-pinterest-p"></i
                  ></a>
                </li>
                <li>
                  <a href="https://www.instagram.com/"
                    ><i class="fa-brands fa-instagram"></i
                  ></a>
                </li>
              </ul>
            </div>
          </div>
          <div class="sub-container">
            <div class="subscribe">
              <p class="description">BE OUR FRIEND</p>
              <form method="post">
                <input type="email" placeholder="Email" />
                <button class="update" type="submit">Updated Me</button>
              </form>
            </div>
          </div>
          <div class="sub-container">
            <div class="contact">
              <p class="description">NEED ASSISTANCE?</p>
              <p class="phone">123-456-7890</p>
              <p class="email">info@mysite.com</p>
            </div>
          </div>
        </div>
        <p class="copyright">
          &copy; 2023 by PRETTY GAL. Proudly created with
          <a href="https://www.wix.com/">Wix.com</a>
        </p>
      </div>
    </footer>
  </body>
</html>
